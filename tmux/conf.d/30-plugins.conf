##### Plugins #################################################################

# Runtime plugin code lives outside the tracked ~/.config repo. Keep startup
# deterministic by sourcing the installed plugins directly instead of relying on
# TPM's asynchronous plugin hook ordering.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins"

# SessionX: fuzzy switch/create sessions; depends on fzf + bat, zoxide optional.
set -g @sessionx-bind 'o'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-preview-location 'right'
set -g @sessionx-preview-ratio '55%'
set -g @sessionx-x-path "$XDG_CONFIG_HOME"
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-fzf-builtin-tmux 'on'
set -g @sessionx-git-branch 'on'
set -g @sessionx-additional-options '--color=bg+:#363A4F,bg:#24273A,spinner:#F4DBD6,hl:#ED8796,fg:#CAD3F5,header:#ED8796,info:#C6A0F6,pointer:#F4DBD6,marker:#B7BDF8,fg+:#CAD3F5,prompt:#C6A0F6,hl+:#ED8796'

# Mouse copy should behave like a normal clipboard selection:
# - put dragged text on CLIPBOARD, not X11 PRIMARY
# - stay in copy/scroll mode after release instead of jumping back immediately
set -g @yank_selection_mouse 'clipboard'
set -g @yank_action 'copy-pipe'

# tmux-resurrect/continuum: persist tmux layouts as state, not config.
set -g @resurrect-dir "$HOME/.local/state/tmux/resurrect"
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-save 'C-s'
set -g @resurrect-restore 'C-r'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'off'

# Deterministic plugin runtime. Most tmux plugins are shell wrappers that call
# tmux commands, so run them as shell scripts. Theme is sourced in 20-theme.conf
# from tmux-language files so status modules can compose after colors exist.
run-shell "$HOME/.local/share/tmux/plugins/tmux-sensible/sensible.tmux"
run-shell "$HOME/.local/share/tmux/plugins/tmux-yank/yank.tmux"
run-shell "$HOME/.local/share/tmux/plugins/vim-tmux-navigator/vim-tmux-navigator.tmux"
run-shell "$HOME/.local/share/tmux/plugins/tmux-resurrect/resurrect.tmux"
run-shell "$HOME/.local/share/tmux/plugins/tmux-continuum/continuum.tmux"

# Bind SessionX through a small launcher that rebuilds SessionX's generated fzf
# args immediately before opening it. This avoids cold-start/reload races.
bind o run-shell "$XDG_CONFIG_HOME/tmux/scripts/sessionx-launch"
