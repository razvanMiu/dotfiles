##### Theme ###################################################################

# Catppuccin. Kept lean: no polling CPU/RAM/battery plugins; dwm owns global
# system status.
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_flags "none"
set -g @catppuccin_status_background "default"

# Source the theme directly after its options are set. This keeps status/window
# styling independent of TPM hook timing on reloads and cold starts. Use the
# tmux-language files directly; catppuccin.tmux is a shell wrapper.
source "$HOME/.local/share/tmux/plugins/tmux/catppuccin_options_tmux.conf"
source "$HOME/.local/share/tmux/plugins/tmux/catppuccin_tmux.conf"
