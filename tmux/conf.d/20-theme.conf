##### Theme ###################################################################

# Catppuccin. Kept lean: no polling CPU/RAM/battery plugins; dwm owns global
# system status.
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_flags "icon"
set -g @catppuccin_window_flags_icon_last ""
set -g @catppuccin_window_flags_icon_current ""
set -g @catppuccin_window_flags_icon_activity " 󱅫"
set -g @catppuccin_window_flags_icon_bell " 󰂞"
set -g @catppuccin_window_flags_icon_zoom " 󰁌"
set -g @catppuccin_status_background "default"
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_connect_separator "no"

# Source the theme directly after its options are set. This keeps status/window
# styling independent of TPM hook timing on reloads and cold starts. Use the
# tmux-language files directly; catppuccin.tmux is a shell wrapper.
source "$HOME/.local/share/tmux/plugins/tmux/catppuccin_options_tmux.conf"
source "$HOME/.local/share/tmux/plugins/tmux/catppuccin_tmux.conf"

# Clear tmux default "underscore" style on current window
set -g window-status-current-style "default"
set -g window-status-style "default"
