##### Prefix and keybindings ##################################################

# Use tmux's default C-b prefix. With Caps Lock mapped to Ctrl this is easy to
# reach, avoids stealing shell/readline C-a, and keeps defaults/docs familiar.
set -g prefix C-b
bind C-b send-prefix

# Reload config quickly and resync environment variables from zsh.
bind r run-shell "$XDG_CONFIG_HOME/tmux/scripts/sync-env" \; source-file "$XDG_CONFIG_HOME/tmux/tmux.conf" \; display-message "tmux config reloaded (env synced)"

# The default C-b t opens clock-mode; it is visual noise in this setup.
unbind t

# Split panes in the current directory.
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Create/close windows in the current directory. Window = tmux tab.
bind c new-window -c "#{pane_current_path}"
bind & kill-window

# Close panes without confirmation.
bind x kill-pane

# Vim-style pane movement and resizing.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

# Manual pane titles. They show in pane borders when set.
bind T command-prompt -p "pane title" "select-pane -T '%%'"

# Project/session workflow.
bind p display-popup -E -w 90% -h 80% "$XDG_CONFIG_HOME/tmux/scripts/project-session"

# Quick toggle between last two windows (Space) and last two sessions (Backspace).
bind Space last-window
bind BSpace switch-client -l

# Reorder windows left/right. Repeatable with -r.
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# Floating Lazygit in current repo. Press 'q' to dismiss.
bind G display-popup -E -d "#{pane_current_path}" -w 90% -h 90% "lazygit"

# Direct window switching without prefix (Alt/Option + 1..9).
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Floating ephemeral Pi scratchpad (persists in-memory while tmux is running, no disk session).
# Click outside or detach (C-b d) to hide without killing. Type /exit to terminate.
bind a display-popup -E -w 90% -h 85% -T " Pi Scratchpad (detach: C-b d | quit: /exit) " "$XDG_CONFIG_HOME/tmux/scripts/pi-popup '#{pane_current_path}'"

# Scratch shell: floating popup that persists until 'exit' (detach: C-b d or click outside).
bind e display-popup -E -w 90% -h 80% -T " Scratch Shell (detach: C-b d | quit: exit) " "$XDG_CONFIG_HOME/tmux/scripts/scratch-popup '#{pane_current_path}'"

# URL picker over pane history.
bind u run-shell 'tmp="${XDG_RUNTIME_DIR:-/tmp}/tmux-urls-$(date +%s)-$$"; tmux capture-pane -pJS - -t "#{pane_id}" > "$tmp"; tmux display-popup -E -w 90% -h 80% "$XDG_CONFIG_HOME/tmux/scripts/open-url \"$tmp\"; rm -f \"$tmp\""'

# Native scrollback search. This enters copy-mode and jumps to the match.
bind / command-prompt -p "search scrollback" 'copy-mode; send-keys -X search-backward "%%"'

# Explicit resurrect save/restore. Continuum still auto-saves periodically.
bind C-s run-shell "$HOME/.local/share/tmux/plugins/tmux-resurrect/scripts/save.sh"
bind C-r run-shell "$HOME/.local/share/tmux/plugins/tmux-resurrect/scripts/restore.sh"

# Fuzzy-filter scrollback in a popup. Selecting a line copies it to clipboard.
bind f run-shell 'tmp="${XDG_RUNTIME_DIR:-/tmp}/tmux-find-$(date +%s)-$$"; tmux capture-pane -pJS - -t "#{pane_id}" > "$tmp"; tmux display-popup -E -w 90% -h 80% "$XDG_CONFIG_HOME/tmux/scripts/find-scrollback \"$tmp\"; rm -f \"$tmp\""'

# Copy mode: vi keys, clipboard copy, and animated line-stepped C-u/C-d so
# scrolling keeps context. This is still terminal grid scrolling, not pixel
# animation, but avoids the default half-page jump.
setw -g mode-keys vi
bind -T copy-mode-vi C-u run-shell -b 'i=0; while [ $i -lt 16 ]; do tmux send-keys -t "#{pane_id}" -X scroll-up; i=$((i + 1)); sleep 0.005; done'
bind -T copy-mode-vi C-d run-shell -b 'i=0; while [ $i -lt 16 ]; do tmux send-keys -t "#{pane_id}" -X scroll-down; i=$((i + 1)); sleep 0.005; done'
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy 2>/dev/null || xclip -in -selection clipboard 2>/dev/null || xsel -ib 2>/dev/null || wl-copy 2>/dev/null || cat >/dev/null"
