# vim:set ft=tmux:
%hidden MODULE_NAME="directory"

set -g "@catppuccin_${MODULE_NAME}_icon" " "
set -gF "@catppuccin_${MODULE_NAME}_color" "#{E:@thm_rosewater}"
set -g "@catppuccin_${MODULE_NAME}_text" " #($XDG_CONFIG_HOME/tmux/scripts/format-path \"#{pane_current_path}\")"

source "$HOME/.local/share/tmux/plugins/tmux/utils/status_module.conf"
